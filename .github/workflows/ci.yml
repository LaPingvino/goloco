name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ebitengine (GLFW, oto) needs the X11, OpenGL and ALSA headers to build,
      # and its test binaries a display: each gets an Xvfb of its own.
      - name: Install Ebitengine's system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev xvfb
      - name: Run tests
        run: scripts/test-all.sh
